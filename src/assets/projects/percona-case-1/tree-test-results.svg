<svg xmlns="http://www.w3.org/2000/svg" width="1212" height="580" viewBox="0 0 1212 580" font-family="'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', roboto, sans-serif">
<rect width="1212" height="580" fill="#fff"/>
<text x="40" y="64" font-size="24" fill="#111" font-weight="700">Six tasks, 17 people each</text>
<text x="40" y="104" font-size="17" fill="#555">One dot per person. The percentage is success among those who answered; skips are</text>
<text x="40" y="130" font-size="17" fill="#555">shown but not counted. A task passes at 70% success and 50% direct — only T3 and T6 had</text>
<text x="40" y="156" font-size="17" fill="#555">anyone reach the answer indirectly, so their direct rates are shown too.</text>
<circle cx="47" cy="194.5" r="7" fill="#286f50"/><text x="62" y="200" font-size="16" fill="#555">Found it directly</text>
<circle cx="237" cy="194.5" r="7" fill="#84c0a2"/><text x="252" y="200" font-size="16" fill="#555">Found it after backtracking</text>
<circle cx="507" cy="194.5" r="7" fill="#c23e36"/><text x="522" y="200" font-size="16" fill="#555">Chose the wrong place</text>
<circle cx="747" cy="194.5" r="7" fill="#bec6d1"/><text x="762" y="200" font-size="16" fill="#555">Gave up</text>
